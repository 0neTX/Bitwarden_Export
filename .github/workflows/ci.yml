name: CI

# Nothing gated the publish workflows before this: a broken bw_export.sh could
# reach :beta and then :latest without a single check running.
on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  test:
    name: shellcheck + unit suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Pinned rather than using the runner's shellcheck: versions disagree about
      # which findings exist, so an image update would fail unrelated pull
      # requests. A function called only from a trap is SC2317 on 0.9 and SC2329
      # on 0.11, which is exactly how this first went red.
      - name: shellcheck
        run: |
          docker run --rm -v "$PWD:/mnt:ro" koalaman/shellcheck:v0.11.0 \
            bw_export.sh entrypoint.sh \
            tests/mock/bw tests/run_tests.sh tests/e2e-setup.sh tests/e2e-verify.sh

      # 80 assertions against a stateful mock of the Bitwarden CLI. This covers
      # the script's logic only; it says nothing about the real CLI, which the
      # end-to-end suite in tests/e2e-setup.sh exercises.
      - name: unit suite
        run: SCRIPT="$PWD/bw_export.sh" bash tests/run_tests.sh

  build:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      # Build only. Catches a broken Dockerfile at review time rather than when
      # a publish workflow pushes it to Docker Hub.
      - name: build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
