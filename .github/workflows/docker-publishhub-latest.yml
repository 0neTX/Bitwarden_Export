on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
        - info
        - warning
        - debug
  push:
    tags:
      # Glob, not a regex: [0-9] matches exactly one character, so the old
      # 'v[0-9].[0-9]' never fired for v1.10 or v1.11.
      - 'v[0-9]*.[0-9]*'
name: CD to Docker Hub to Release-Latest
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/bw-export:${{  github.ref_name }}, ${{ secrets.DOCKER_USERNAME }}/bw-export:latest
      - uses: actions/checkout@v5
      - name: Docker Hub Description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: 0netx/bw-export
