version: 2

updates:
  # Six actions had to be bumped by hand in #23 after GitHub started warning
  # about Node 20 on every run. This keeps them current instead.
  #
  # target-branch matters: without it Dependabot opens its pull requests
  # against main, which is the release branch. Everything lands on dev first.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    open-pull-requests-limit: 5
    # No labels: are set. Dependabot can only apply labels that already exist in
    # the repository, and there is no "dependencies" label here yet.

  # The base image only: Dependabot reads FROM, not the ADD and curl downloads,
  # so BW_CLI_VERSION and SHOUTRRR_VERSION stay pinned by hand to versions
  # tested against Vaultwarden. The base is pinned to Ubuntu 24.04 by digest;
  # this proposes a new digest when Ubuntu republishes 24.04 with security
  # fixes, and never a newer Ubuntu release. The nightly end-to-end run is what
  # catches a Bitwarden CLI release that breaks login.
  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: ubuntu
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
