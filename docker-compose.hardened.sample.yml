# A hardened profile for a container that stays up (CRON) holding full access
# to the vault: no root, no capabilities, no writable image, credentials as
# Docker secrets rather than environment variables.
#
# Before the first start:
#   1. The export folders must belong to the user below:
#        mkdir -p export/data export/attachments
#        sudo chown -R 1000:1000 export
#   2. One file per secret, readable by that user and nobody else:
#        mkdir -p secrets && chmod 700 secrets
#        printf '%s' '<client_id>'       > secrets/bw_clientid
#        printf '%s' '<client_secret>'   > secrets/bw_clientsecret
#        printf '%s' '<master password>' > secrets/bw_password
#        printf '%s' '<export password>' > secrets/export_password
#        chmod 400 secrets/* && sudo chown -R 1000:1000 secrets
services:
  bw-export:
    container_name: bw-export
    image: 0netx/bw-export:latest
    restart: unless-stopped

    # Never root: the user setup and "su" are skipped, and PUID/PGID are not
    # used. Files are created as this uid:gid.
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The only writable place outside the volumes. It holds the CLI's session
    # (tokens never touch the disk), the run log and, with ENCRYPT_ATTACHMENTS,
    # one run's attachments before they are encrypted: size it to fit them.
    tmpfs:
      - /tmp:size=256m,mode=1777
    pids_limit: 200

    volumes:
      - ./export/data:/var/data
      - ./export/attachments:/var/attachments

    secrets:
      - bw_clientid
      - bw_clientsecret
      - bw_password
      - export_password
    environment:
      # A path to a file is read as the value.
      - BW_CLIENTID=/run/secrets/bw_clientid
      - BW_CLIENTSECRET=/run/secrets/bw_clientsecret
      - BW_PASSWORD=/run/secrets/bw_password
      - EXPORT_PASSWORD=/run/secrets/export_password
      - ENCRYPT_ATTACHMENTS=true
      - BW_URL_SERVER=https://vault.example.com
      - CRON=0 3 * * *
      - TZ=Europe/Madrid
      - KEEP_GFS=7d:4w:6m
      # Keep the log with the exports, not in the tmpfs, which is lost on restart.
      - FILE_LOG=/var/data/bw-export-logfile.log

secrets:
  bw_clientid:
    file: ./secrets/bw_clientid
  bw_clientsecret:
    file: ./secrets/bw_clientsecret
  bw_password:
    file: ./secrets/bw_password
  export_password:
    file: ./secrets/export_password
