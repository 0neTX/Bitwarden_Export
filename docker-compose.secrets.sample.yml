# Credentials as Docker secrets instead of environment variables, so neither
# "docker inspect" nor the compose file shows them.
#
# Before the first start, one file per secret, readable only by you:
#   mkdir -p .secrets && chmod 700 .secrets
#   printf '%s' '<client_id>'       > .secrets/.bwclientid
#   printf '%s' '<client_secret>'   > .secrets/.bwsecret
#   printf '%s' '<master password>' > .secrets/.bwpassword
#   printf '%s' '<export password>' > .secrets/.exportpassword
#   chmod 400 .secrets/.*
#
# Every secret a *_FILE variable points to must also be listed under the
# service's "secrets:", or its file is not mounted and the run stops with an
# error naming the variable.
services:
  bw-export:
    container_name: bw-export
    tty: true
    image: 0netx/bw-export:latest
    volumes:
      # One mount per folder. Mounting a parent such as /var does not work: the
      # image declares /var/data and /var/attachments as volumes, so Docker
      # puts anonymous volumes over them and the exports never reach the host.
      - ./export/data:/var/data
      - ./export/attachments:/var/attachments
    environment:
      # Each *_FILE variable holds the path of a file with the value.
      - BW_CLIENTID_FILE=/run/secrets/bwclientid
      - BW_CLIENTSECRET_FILE=/run/secrets/bwsecret
      - BW_PASSWORD_FILE=/run/secrets/bwpassword
      - EXPORT_PASSWORD_FILE=/run/secrets/exportpassword
      # Optional: uncomment together with its secret below, once its file exists.
      # Compose refuses to start with a secret whose file does not exist.
      # - NOTIFICATION_URL_FILE=/run/secrets/notificationurl
      # - PING_URL_FILE=/run/secrets/pingurl
      # Optional: Own Vaultwarden/Bitwarden self-hosted server
      # - BW_URL_SERVER=https://vault.example.com
      # Optional: comma-separated organization IDs, or "none". By default, every
      # organization you own or administer.
      # - BW_ORGANIZATIONS_LIST=<organization id>,<organization id>
      # Optional: Execution logging file. Please check output path is mapping inside a volume
      # - FILE_LOG=/var/data/bw-export-logfile.log
      # Optional: Keep the maximum number of exports defined.
      # - KEEP_LAST_BACKUPS=5
    secrets:
      - bwclientid
      - bwsecret
      - bwpassword
      - exportpassword
      # - notificationurl
      # - pingurl

secrets:
  bwclientid:
    file: ./.secrets/.bwclientid
  bwsecret:
    file: ./.secrets/.bwsecret
  bwpassword:
    file: ./.secrets/.bwpassword
  exportpassword:
    file: ./.secrets/.exportpassword
  # notificationurl:
  #   file: ./.secrets/.notificationurl
  # pingurl:
  #   file: ./.secrets/.pingurl
